# Serves the production build. Convex and Clerk are hosted services: pass their
# public identifiers at build time (see .env.example). Without them the app
# starts and shows a configuration page.
services:
  web:
    build:
      context: .
      args:
        VITE_CONVEX_URL: ${VITE_CONVEX_URL:-}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
    ports:
      - "${QUORUM_PORT:-8080}:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
